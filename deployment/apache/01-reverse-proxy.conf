# Generated reverse-proxy contract. Edit ADDONS.apache in project.json,
# not this synchronized output.
# Separate virtual hosts are recommended for multi-app deployments and
# identity providers because each service keeps its native root URL.

<VirtualHost *:8080>
    ServerName localhost
    ProxyRequests Off
    ProxyPreserveHost On
    AllowEncodedSlashes NoDecode
    RequestHeader set X-Forwarded-Proto "${APACHE_FORWARDED_PROTO}"
    RequestHeader set X-Forwarded-Port "${APACHE_FORWARDED_PORT}"
    RequestHeader set X-Forwarded-Host "localhost"
    LimitRequestBody ${APACHE_LIMIT_REQUEST_BODY}
    ProxyPass /static/ !
    Alias /static/ /var/www/app/static/
    <Directory "/var/www/app/static">
        Require all granted
    </Directory>
    ProxyPass /documents/ !
    Alias /documents/ /var/www/app/documents/
    <Directory "/var/www/app/documents">
        Require all granted
    </Directory>
    ProxyPass / http://app:${APP_APP_PORT}/
    ProxyPassReverse / http://app:${APP_APP_PORT}/
    ProxyTimeout 120
    TimeOut 120
    ErrorLog "logs/localhost.error.log"
    CustomLog "logs/localhost.access.log" combined
</VirtualHost>
