# Apache reverse proxy source configuration for relecov-iskylims.
#
# This file is copied to conf/apache/01-reverse-proxy.conf by the scaffold.
# Customize its VirtualHost and route blocks in the application repository.
# container_install.sh replaces every shell-style uppercase variable from the protected
# deployment environment and writes deployment/apache/01-reverse-proxy.conf.
#
# This baseline routes the service selected by ADDONS.apache.CONFIG_SERVICE.
# For a single application, or for that selected default service, use the short
# values INSTALL_PATH, APACHE_UPSTREAM_SERVICE, and APACHE_UPSTREAM_PORT below.
# INSTALL_PATH is read from the selected service's production/test settings.
#
# In a multi-application deployment, every service already exports its own
# prefix: api provides API_APP_PORT and API_INSTALL_PATH, web provides
# WEB_APP_PORT and WEB_INSTALL_PATH, and so on. Use those service-owned values
# directly in additional VirtualHost/path blocks; do not create APACHE_API_* or
# APACHE_WEB_* copies.
#
# MULTI-APPLICATION ROUTING SUMMARY
# 1. Put static/document ProxyPass exclusions and Alias directives before a
#    matching catch-all ProxyPass.
# 2. A Django service named api uses API_INSTALL_PATH for mounted assets and
#    API_APP_PORT for proxying to http://api:<port>/.
# 3. A Django service named analysis similarly uses ANALYSIS_INSTALL_PATH and
#    ANALYSIS_APP_PORT. Each Django service has its own mounted asset paths.
# 4. A React service named web normally needs only a proxy to
#    http://web:<WEB_APP_PORT>/ because Nginx serves its compiled assets.
# 5. Use distinct URL prefixes or VirtualHosts so catch-all routes do not
#    overlap. Complete copyable examples live in the Apache add-on README.
<VirtualHost *:8080>
    ServerName ${APACHE_SERVER_NAME}

    ProxyRequests Off
    ProxyPreserveHost On
    AllowEncodedSlashes NoDecode
    RequestHeader set X-Forwarded-Proto "${APACHE_FORWARDED_PROTO}"
    RequestHeader set X-Forwarded-Port "${APACHE_FORWARDED_PORT}"
    RequestHeader set X-Forwarded-Host "${APACHE_SERVER_NAME}"

    # Keep Apache and ModSecurity request-body limits aligned.
    LimitRequestBody ${APACHE_LIMIT_REQUEST_BODY}
    <IfModule security2_module>
        SecRequestBodyLimit ${APACHE_LIMIT_REQUEST_BODY}
        SecRequestBodyNoFilesLimit ${APACHE_LIMIT_REQUEST_BODY}
    </IfModule>

    # These exclusions must precede the catch-all ProxyPass. The installer
    # INSTALL_PATH comes from CONFIG_SERVICE. Compose mounts the selected
    # service's static and documents sources at these exact container paths.
    ProxyPass /static/ !
    Alias /static/ "${INSTALL_PATH}/static/"
    <Directory "${INSTALL_PATH}/static">
        Require all granted
    </Directory>

    ProxyPass /documents/ !
    Alias /documents/ "${INSTALL_PATH}/documents/"
    <Directory "${INSTALL_PATH}/documents">
        Require all granted
    </Directory>

    # Default single-service route. Change or duplicate this block when the
    # deployment exposes multiple applications or path prefixes. Prefixed
    # values such as API_INSTALL_PATH remain available for additional blocks.
    ProxyPass / http://${APACHE_UPSTREAM_SERVICE}:${APACHE_UPSTREAM_PORT}/
    ProxyPassReverse / http://${APACHE_UPSTREAM_SERVICE}:${APACHE_UPSTREAM_PORT}/
    ProxyTimeout ${APACHE_PROXY_TIMEOUT}
    TimeOut ${APACHE_PROXY_TIMEOUT}

    CustomLog logs/${APACHE_LOG_STEM}-apache.access.log combined env=!forwarded
    CustomLog logs/${APACHE_LOG_STEM}-apache.access.log proxy env=forwarded
    ErrorLog logs/${APACHE_LOG_STEM}-apache.error.log
</VirtualHost>

# OPTIONAL SECOND DNS VIRTUAL HOST
# Copy this commented example into an application's source configuration and
# replace every angle-bracket value. Give it the same forwarded-header,
# request-limit, timeout, and per-host logging contract as the default vhost.
#
# <VirtualHost *:8080>
#     ServerName <SECOND_PUBLIC_DNS>
#
#     ProxyRequests Off
#     ProxyPreserveHost On
#     AllowEncodedSlashes NoDecode
#     RequestHeader set X-Forwarded-Proto "<PUBLIC_SCHEME>"
#     RequestHeader set X-Forwarded-Port "<PUBLIC_PORT>"
#     RequestHeader set X-Forwarded-Host "<SECOND_PUBLIC_DNS>"
#
#     LimitRequestBody <LIMIT_REQUEST_BODY_BYTES>
#     <IfModule security2_module>
#         SecRequestBodyLimit <LIMIT_REQUEST_BODY_BYTES>
#         SecRequestBodyNoFilesLimit <LIMIT_REQUEST_BODY_BYTES>
#     </IfModule>
#
#     ProxyPass / http://<COMPOSE_SERVICE>:<INTERNAL_PORT>/
#     ProxyPassReverse / http://<COMPOSE_SERVICE>:<INTERNAL_PORT>/
#     ProxyTimeout <PROXY_TIMEOUT_SECONDS>
#     TimeOut <PROXY_TIMEOUT_SECONDS>
#
#     CustomLog logs/<LOG_STEM>-apache.access.log combined env=!forwarded
#     CustomLog logs/<LOG_STEM>-apache.access.log proxy env=forwarded
#     ErrorLog logs/<LOG_STEM>-apache.error.log
# </VirtualHost>
