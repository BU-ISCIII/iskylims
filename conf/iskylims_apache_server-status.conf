# ExtendedStatus controls whether Apache will generate "full" status
# information when the "server-status" handler is called.
ExtendedStatus On

<VirtualHost *:8080>
    ServerName __SERVER_STATUS_SERVER_NAME__
    ServerAlias __SERVER_STATUS_ALIASES__
    <Location /server-status>
        SetHandler server-status
        Order deny,allow
        Deny from all
        Allow from __SERVER_STATUS_ALLOW_FROM__
    </Location>
</VirtualHost>
