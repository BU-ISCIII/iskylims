# Apache reverse proxy config for iSkyLIMS production container

<VirtualHost *:8080>
    ServerName __ISKYLIMS_SERVER_NAME__

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "__ISKYLIMS_FORWARDED_PROTO__"
    RequestHeader set X-Forwarded-Port "__ISKYLIMS_FORWARDED_PORT__"
    RequestHeader set X-Forwarded-Host "__ISKYLIMS_SERVER_NAME__"
 

    # Allow larger POST bodies to reach Django instead of being rejected by
    # Apache first. Adjust this value if your deployment needs larger uploads.
    LimitRequestBody 52428800

    <IfModule security2_module>
        SecRequestBodyLimit 52428800
        SecRequestBodyNoFilesLimit 52428800
    </IfModule>

    ProxyPass /static !
    Alias /static __INSTALL_PATH__/static
    <Directory __INSTALL_PATH__/static>
        Require all granted
    </Directory>

    ProxyPass /documents !
    Alias /documents __INSTALL_PATH__/documents
    <Directory __INSTALL_PATH__/documents>
        Require all granted
    </Directory>

    ProxyPass / http://app:__APP_PORT__/
    ProxyPassReverse / http://app:__APP_PORT__/
    ProxyTimeout __GUNICORN_TIMEOUT__
    TimeOut __GUNICORN_TIMEOUT__

    CustomLog logs/__ISKYLIMS_LOG_NAME__-apache.access.log combined env=!forwarded
    CustomLog logs/__ISKYLIMS_LOG_NAME__-apache.access.log proxy env=forwarded
    ErrorLog logs/__ISKYLIMS_LOG_NAME__-apache.error.log

</VirtualHost>
