# Example Apache reverse proxy config for iSkyLIMS (Docker production)
# Replace ServerName and adjust the ProxyPass target if needed.

<VirtualHost *:80>
    ServerName example.isciiides.es

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    # If Apache runs on the host, proxy to the published port
    ProxyPass / http://localhost:8001/
    ProxyPassReverse / http://localhost:8001/

    # If Apache runs in the same Docker network, use the service name instead:
    # ProxyPass / http://app:8001/
    # ProxyPassReverse / http://app:8001/

    # Serve static files from a host path (bind-mounted from the container)
    # Example: /opt/iskylims/static-host -> /opt/iskylims/static in docker-compose.prod.yml
    ProxyPass /static/ !
    Alias /static/ /opt/iskylims/static-host/
    <Directory /opt/iskylims/static-host/>
        Require all granted
    </Directory>

    ErrorLog logs/iskylims-apache.error.log
    CustomLog logs/iskylims-apache.access.log combined env=!forwarded
    CustomLog logs/iskylims-apache.access.log proxy env=forwarded
</VirtualHost>
