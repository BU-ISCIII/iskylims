# Apache reverse proxy config for iSkyLIMS production container

<VirtualHost *:8080>
    ServerName dockeriskyims.isciiides.es

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    RequestHeader set X-Forwarded-Host "dockeriskyims.isciiides.es"
 

    # Allow larger POST bodies to reach Django instead of being rejected by
    # Apache first. Adjust this value if your deployment needs larger uploads.
    LimitRequestBody 52428800

    <IfModule security2_module>
        SecRequestBodyLimit 52428800
        SecRequestBodyNoFilesLimit 52428800
    </IfModule>

    ProxyPass /static !
    Alias /static /opt/iskylims/static
    <Directory /opt/iskylims/static>
        Require all granted
    </Directory>

    ProxyPass / http://app:8001/
    ProxyPassReverse / http://app:8001/
    ProxyTimeout 300
    TimeOut 300

    #ErrorLog logs/iskylims.pre.isciii.es-apache.error.log
    #CustomLog logs/iskylims.pre.isciii.es-apache.access.log combined

    CustomLog logs/dockeriskyims.isciiides.es-apache.access.log combined env=!forwarded
    CustomLog logs/dockeriskyims.isciiides.es-apache.access.log proxy env=forwarded

    ErrorLog logs/iskylims.pre.isciii.es-apache.error.log

</VirtualHost>
