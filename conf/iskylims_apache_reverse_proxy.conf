# Apache reverse proxy config for iSkyLIMS production container

<VirtualHost *:8080>
    ServerName iskyimsdocker.isciiides.es

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "8080"
    RequestHeader set X-Forwarded-Host "iskyimsdocker.isciiides.es"

    # Allow larger POST bodies to reach Django instead of being rejected by
    # Apache first. Adjust this value if your deployment needs larger uploads.
    LimitRequestBody 52428800

    <IfModule security2_module>
        SecRequestBodyLimit 52428800
        SecRequestBodyNoFilesLimit 52428800
    </IfModule>

    ProxyPass /static !
    Alias /static /opt/iskylims/static
    <Directory /opt/iskylims/static>
        Require all granted
    </Directory>

    ProxyPass / http://app:8001/
    ProxyPassReverse / http://app:8001/
    ProxyTimeout 300
    TimeOut 300

    ErrorLog /var/log/httpd/iskylims-apache.error.log
    CustomLog /var/log/httpd/iskylims-apache.access.log combined
</VirtualHost>
