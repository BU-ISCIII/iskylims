# Apache reverse proxy config for iSkyLIMS production container

<VirtualHost *:8080>
    ServerName iskyimsdocker.isciiides.es

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "8080"

    ProxyPass / http://app:8001/
    ProxyPassReverse / http://app:8001/

    ErrorLog /var/log/httpd/iskylims-apache.error.log
    CustomLog /var/log/httpd/iskylims-apache.access.log combined
</VirtualHost>
