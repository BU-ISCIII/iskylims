services:
  # BEGIN BU-ISCIII SERVICE: iskylims (django)
  iskylims:
    image: "${ISKYLIMS_IMAGE:-iskylims:local}"
    build:
      context: "."
      dockerfile: "Dockerfile"
      args:
        GIT_REVISION: ${GIT_REVISION:-current}
        # Fixed internal path used only while install.sh reads the build secret.
        INSTALL_CONF: "conf/.runtime_install_settings.txt"
        USE_INSTALL_CONF_SECRET: "true"
        RENDER_DJANGO_SETTINGS: "false"
        APP_UID: ${ISKYLIMS_APP_UID:?ISKYLIMS_APP_UID is required}
        APP_GID: ${ISKYLIMS_APP_GID:?ISKYLIMS_APP_GID is required}
        APP_PORT: ${ISKYLIMS_APP_PORT:?ISKYLIMS_APP_PORT is required}
        APP_REPO_PATH: ${ISKYLIMS_REPO_PATH:?ISKYLIMS_REPO_PATH is required}
        APP_INSTALL_PATH: ${ISKYLIMS_INSTALL_PATH:?ISKYLIMS_INSTALL_PATH is required}
    restart: unless-stopped

    user: "${ISKYLIMS_APP_UID:?ISKYLIMS_APP_UID is required}:${ISKYLIMS_APP_GID:?ISKYLIMS_APP_GID is required}"
    environment:
      APP_MODE: prod
      INSTALL_PATH: ${ISKYLIMS_INSTALL_PATH:?ISKYLIMS_INSTALL_PATH is required}
      APP_INSTALL_PATH: ${ISKYLIMS_INSTALL_PATH:?ISKYLIMS_INSTALL_PATH is required}
      APP_PORT: ${ISKYLIMS_APP_PORT:?ISKYLIMS_APP_PORT is required}
      PROJECT_MODULE: "iskylims"
      DB_HOST: ${ISKYLIMS_DB_HOST:?ISKYLIMS_DB_HOST is required}
      DB_PORT: ${ISKYLIMS_DB_PORT:?ISKYLIMS_DB_PORT is required}
      DB_NAME: ${ISKYLIMS_DB_NAME:?ISKYLIMS_DB_NAME is required}
      DB_USER: ${ISKYLIMS_DB_USER:?ISKYLIMS_DB_USER is required}
      DB_PASSWORD: ${ISKYLIMS_DB_PASSWORD:?ISKYLIMS_DB_PASSWORD is required}
      DJANGO_SECRET_KEY: ${ISKYLIMS_DJANGO_SECRET_KEY:?ISKYLIMS_DJANGO_SECRET_KEY is required}
      DJANGO_ALLOWED_HOSTS: ${ISKYLIMS_DJANGO_ALLOWED_HOSTS:?ISKYLIMS_DJANGO_ALLOWED_HOSTS is required}
    volumes:
      - iskylims_documents:${ISKYLIMS_INSTALL_PATH:?ISKYLIMS_INSTALL_PATH is required}/documents:z
      - ${ISKYLIMS_HOST_LOG_PATH:?ISKYLIMS_HOST_LOG_PATH is required}:${ISKYLIMS_INSTALL_PATH:?ISKYLIMS_INSTALL_PATH is required}/logs:Z
      - ${ISKYLIMS_DJANGO_SETTINGS_PATH:?ISKYLIMS_DJANGO_SETTINGS_PATH is required}:${ISKYLIMS_INSTALL_PATH:?ISKYLIMS_INSTALL_PATH is required}/iskylims/settings.py:Z
      - iskylims_static:${ISKYLIMS_INSTALL_PATH:?ISKYLIMS_INSTALL_PATH is required}/static:z
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['APP_PORT'] + '/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:${ISKYLIMS_APP_PORT:?ISKYLIMS_APP_PORT is required}:${ISKYLIMS_APP_PORT:?ISKYLIMS_APP_PORT is required}"
    # Docker Engine on Linux needs this explicit mapping. Podman also supports
    # host-gateway and conventionally exposes host.docker.internal itself, so
    # host-based dependencies can use one hostname with either engine.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [deployment_net]
  # END BU-ISCIII SERVICE: iskylims
  # BEGIN BU-ISCIII ADDON: apache
  iskylims-apache:
    image: registry.access.redhat.com/ubi9/httpd-24:latest
    restart: unless-stopped
    depends_on:
      iskylims:
        condition: service_healthy
    ports:
      # Public binding can be restricted to loopback when another host proxy
      # terminates TLS before forwarding traffic to this container.
      - "${APACHE_BIND_HOST:?APACHE_BIND_HOST is required}:${APACHE_PORT:?APACHE_PORT is required}:8080"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      # REQUIRED runtime-rendered read-only configuration bind sources.
      - ./deployment/apache/00-logs.conf:/etc/httpd/conf.d/00-logs.conf:ro,z
      - ./deployment/apache/01-reverse-proxy.conf:/etc/httpd/conf.d/01-reverse-proxy.conf:ro,z
      - ./deployment/apache/02-server-status.conf:/etc/httpd/conf.d/02-server-status.conf:ro,z
      # REQUIRED persistent host log bind. Back it up/rotate per host policy.
      - ${APACHE_LOG_PATH:?APACHE_LOG_PATH is required}:/var/log/httpd:z
      # REQUIRED when container and host timezone must agree in log records.
      - /etc/localtime:/etc/localtime:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      # GENERATED MULTI-APP MOUNTS: one read-only static/documents pair for
      # every Django service. React assets remain inside the React image.
      - iskylims_static:${ISKYLIMS_INSTALL_PATH:?ISKYLIMS_INSTALL_PATH is required}/static:ro,z
      - iskylims_documents:${ISKYLIMS_INSTALL_PATH:?ISKYLIMS_INSTALL_PATH is required}/documents:ro,z
      # OPTIONAL APP MOUNTS belong in ADDONS.apache.MOUNTS. Examples:
      # - reports_data:/var/www/reports:ro,z
      # - /srv/public-downloads:/var/www/downloads:ro,Z
    networks: [deployment_net]
  # END BU-ISCIII ADDON: apache

networks:
  deployment_net:

volumes:
  iskylims_documents:
  iskylims_static:
